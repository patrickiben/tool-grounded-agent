name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Self-test (zero dependencies)
        run: python selftest.py
      - name: Install development dependencies and run suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
          python -m pytest -q
      - name: CLI export
        run: python -m toolagent scenarios/ae_overview.json --json results.json --junit results.xml
      - name: Build wheel and import outside the source checkout
        run: |
          python -m pip wheel --no-deps . -w dist
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          .wheel-smoke/bin/python -I -c "import toolagent; print(toolagent.__version__)"
